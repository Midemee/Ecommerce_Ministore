<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MiniStore - Sign In</title>

  <link rel="stylesheet" href="signin.css">
</head>

<body>

  <header class="header">

    <div class="header-container">

      <a href="../LandingPage/landing.html" class="logo">
        Mini<span>Store</span>
      </a>

      <nav class="nav">

        <a href="../LandingPage/landing.html" class="nav-link">
          Home
        </a>

        <a href="../Cart/cart.html" class="nav-link">
          Products
        </a>

        <a href="../Auth/signin.html" class="nav-link">
          Sign In
        </a>

        <a href="../Auth/register.html" class="signup-btn">
          Sign Up
        </a>

      </nav>

    </div>

  </header>

  <main class="page-content">

    <div class="signin-card">

      <div class="form-header">

        <h1>
          Welcome Back
        </h1>

        <p class="subtitle">
          Sign In To Your Account
        </p>

      </div>


      <form id="signin-form">

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="password-toggle"
              aria-label="Show password"
            >

              <svg
                class="eye-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />

              </svg>

            </button>

          </div>

        </div>

        <p class="forgot-password">
          <a href="#">
            Forgot Password?
          </a>
        </p>

        <button
          type="submit"
          class="signin-button"
        >
          Sign In
        </button>

        <p class="signup-text">
          Dont have an account?
          <a href="../Auth/register.html">
            Sign Up
          </a>
        </p>

      </form>

    </div>

  </main>


  <script src="signin.js"></script>

</body>

</html>
